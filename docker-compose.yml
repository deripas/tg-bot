services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tgbot
      POSTGRES_USER: ${DB_USER:-tgbot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tgbot}
    ports:
      # for local development; only on localhost of the server
      - "127.0.0.1:5432:5432"
    volumes:
      - ./.pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d tgbot"]
      interval: 5s
      retries: 10

