spring:
  application:
    name: tg-bot
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      # receipt photos from a phone are several megabytes; Telegram bots download files up to 20 MB
      max-file-size: 20MB
      max-request-size: 20MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tgbot}
    username: ${DB_USER:tgbot}
    password: ${DB_PASSWORD:tgbot}
  # one database, a schema per module with its own migrations and Flyway history; no foreign keys between schemas
  flyway:
    schemas: app
    default-schema: app
    locations: classpath:db/migration/app

tgbot:
  token: ${TELEGRAM_BOT_TOKEN:}
  admin: ${TGBOT_ADMIN:}
  public-url: ${TGBOT_PUBLIC_URL:http://localhost:8080}
  receipt:
    enabled: ${TGBOT_RECEIPT_ENABLED:true}
    ollama-base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

management:
  endpoints:
    web:
      exposure:
        include: health,info
