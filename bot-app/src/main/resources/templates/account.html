<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tg-bot: учётная запись</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="auth">
    <div class="card">
        <a th:href="@{/}" class="back-link">← tg-bot</a>
        <h1>Учётная запись</h1>

        <div th:if="${saved}" class="message success">Сохранено. Теперь можно входить по логину и паролю.</div>
        <div th:if="${error}" class="message error" th:switch="${error}">
            <span th:case="'login'">Логин: от 3 до 32 символов, латинские буквы, цифры, «_», «.», «-».</span>
            <span th:case="'taken'">Этот логин уже занят.</span>
            <span th:case="'password'">Пароль должен быть не короче 8 символов.</span>
            <span th:case="'confirmation'">Пароли не совпадают.</span>
        </div>
        <div th:unless="${user.hasPassword()}" class="message">Задайте логин и пароль, чтобы входить в Web UI без бота.</div>

        <form method="post" th:action="@{/account}">
            <div class="form-group">
                <label for="login">Логин</label>
                <input id="login" name="login" th:value="${user.login()}" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" required autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="confirmation">Ещё раз</label>
                <input id="confirmation" name="confirmation" type="password" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-block">Сохранить</button>
        </form>
    </div>
</main>
</body>
</html>
