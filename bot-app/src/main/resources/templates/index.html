<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>tg-bot</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
        a { color: #2563eb; }
    </style>
</head>
<body>
<h1>tg-bot</h1>
<p th:if="${modules.isEmpty()}">Нет подключённых навыков с Web UI.</p>
<ul>
    <li th:each="module : ${modules}"><a th:href="@{${module.path()}}" th:text="${module.title()}">Раздел</a></li>
</ul>
</body>
</html>
