<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Чеки</title>
    <!-- common styles of the app -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .upload-form { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
        .upload-form input[type="file"] { flex: 1 1 240px; }
        /* statuses that need a human: a duplicate first of all */
        tr.DUPLICATE td { background: #fffbeb; }
        tr.NEED_REVIEW td { background: #f0f9ff; }
        tr.ERROR td { background: #fef2f2; }
        /* the row is classed by the status, so is its badge */
        tr.SUCCESS .badge { border-color: #bbf7d0; background: #dcfce7; color: #166534; }
        tr.NEED_REVIEW .badge { border-color: #bae6fd; background: #e0f2fe; color: #075985; }
        tr.DUPLICATE .badge { border-color: #fde68a; background: #fef3c7; color: #92400e; }
        tr.ERROR .badge { border-color: #fecaca; background: #fee2e2; color: #991b1b; }
        .reason { margin-top: .25rem; max-width: 28rem; font-size: .8rem; }
        @media (max-width: 640px) {
            .upload-form .btn { width: 100%; }
        }
    </style>
</head>
<body>
<main class="container">
    <a th:href="@{/}" class="back-link">← tg-bot</a>
    <header class="page-header">
        <h1>Чеки</h1>
    </header>

    <div th:if="${added}" class="message success">Чек <b th:text="${added}">1</b> добавлен.</div>
    <div th:if="${duplicate}" class="message error">Это фото уже загружено: чек <b th:text="${duplicate}">1</b>.</div>
    <div th:if="${error}" class="message error">Не удалось загрузить: <span th:text="${error}">ошибка</span></div>
    <div th:if="${deleted}" class="message">Чек <b th:text="${deleted}">1</b> удалён.</div>

    <section class="card">
        <h2>Загрузить чек</h2>
        <form class="upload-form" method="post" enctype="multipart/form-data" th:action="@{/receipts}">
            <input type="file" name="photo" accept="image/*" required>
            <button type="submit" class="btn">Загрузить</button>
        </form>
    </section>

    <div th:if="${receipts.isEmpty()}" class="card muted empty">Чеков пока нет: загрузите фото или отправьте боту с подписью <code>/bill add</code>.</div>
    <div th:unless="${receipts.isEmpty()}" class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>#</th>
                <th>Загружен</th>
                <th>Покупка</th>
                <th>Статус</th>
                <th>Магазин</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="receipt : ${receipts}" th:class="${receipt.status()}">
                <td class="num" th:text="${receipt.id()}">1</td>
                <td class="nowrap num" th:text="${#temporals.format(receipt.createdAt(), 'dd.MM.yyyy HH:mm')}">15.10.2026 18:53</td>
                <td class="nowrap num" th:text="${receipt.purchasedAt() != null ? #temporals.format(receipt.purchasedAt(), 'dd.MM.yyyy HH:mm') : '—'}">25.09.2026 18:53</td>
                <td>
                    <span class="badge" th:text="${receipt.status()}">CREATED</span>
                    <div th:if="${receipt.reason()}" class="muted reason" th:text="${receipt.reason()}">причина</div>
                </td>
                <td th:text="${receipt.storeName() != null ? receipt.storeName() : '—'}">PEPCO</td>
                <td class="nowrap">
                    <form class="inline" method="post" th:action="@{/receipts/{id}/delete(id=${receipt.id()})}"
                          th:data-confirm="|Удалить чек ${receipt.id()}?|" onsubmit="return confirm(this.dataset.confirm)">
                        <button type="submit" class="btn btn-danger btn-sm">Удалить</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
